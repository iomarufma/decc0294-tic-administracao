<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eleição Presidencial 2026 — Mapa Coroplético (dados do TSE)</title>
<style>
  :root{
    --lula:#d62728; --flavio:#1d4ed8; --neutro:#6b7280;
    --bg:#f6f7f9; --painel:#ffffff; --texto:#1f2430; --borda:#dfe3e8;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--texto);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
  header h1{margin:0 0 4px;font-size:22px}
  header p{margin:0;color:#5b6270;font-size:13px}
  .painel{background:var(--painel);border:1px solid var(--borda);border-radius:10px;padding:14px 16px;margin-top:16px}
  .controles{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end}
  .ctrl{display:flex;flex-direction:column;gap:6px}
  .ctrl label.titulo{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#6b7280;font-weight:600}
  .grupo{display:flex;gap:8px}
  .grupo button, select{font:inherit;padding:7px 14px;border:1px solid var(--borda);background:#fff;
    border-radius:8px;cursor:pointer}
  .grupo button.ativo{background:#1f2430;color:#fff;border-color:#1f2430;font-weight:600}
  .resumo{margin-left:auto;text-align:right;font-size:13px;color:#3c4351;line-height:1.5}
  .resumo b{font-size:15px}
  .mapa-linha{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px}
  .mapa-box{flex:1 1 640px;background:var(--painel);border:1px solid var(--borda);border-radius:10px;padding:10px;position:relative}
  svg#mapa{width:100%;height:auto;display:block}
  svg#mapa path.uf{stroke:#ffffff;stroke-width:.9;cursor:pointer;transition:fill .15s}
  svg#mapa path.uf:hover{stroke:#1f2430;stroke-width:1.6}
  .legenda-box{flex:0 0 260px;background:var(--painel);border:1px solid var(--borda);border-radius:10px;padding:14px}
  .legenda-box h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:#6b7280}
  .chips{display:flex;flex-direction:column;gap:8px}
  .chip{display:flex;align-items:center;gap:8px;font-size:13px}
  .chip .sw{width:26px;height:16px;border-radius:3px;border:1px solid rgba(0,0,0,.15);flex:none}
  .barra{height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.12);margin:6px 0 2px}
  .ticks{display:flex;justify-content:space-between;font-size:11px;color:#6b7280}
  .nota{font-size:12px;color:#5b6270;margin-top:12px;line-height:1.45}
  #tooltip{position:fixed;pointer-events:none;background:rgba(20,24,32,.96);color:#fff;
    padding:10px 12px;border-radius:8px;font-size:12.5px;line-height:1.5;max-width:280px;
    opacity:0;transition:opacity .12s;z-index:10;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  #tooltip b{font-size:14px}
  #tooltip .linha{display:flex;justify-content:space-between;gap:14px}
  #tooltip .linha span:last-child{font-variant-numeric:tabular-nums}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 10px;border-bottom:1px solid var(--borda);text-align:right;white-space:nowrap}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#6b7280;cursor:default}
  th:first-child,td:first-child{text-align:left}
  td.num{font-variant-numeric:tabular-nums}
  .venc{font-weight:700}
  .ponto{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:baseline}
  footer{margin-top:18px;font-size:12px;color:#6b7280;line-height:1.6}
  footer code{background:#eceff3;padding:1px 5px;border-radius:4px;font-size:11px}
  @media (max-width:760px){ .resumo{margin-left:0;text-align:left} .legenda-box{flex:1 1 100%} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Eleição Presidencial do Brasil 2026 — Mapa coroplético</h1>
    <p>Votos por unidade da federação nos turnos de 04/10/2026 e 25/10/2026. Fonte: TSE (API de divulgação de resultados) e malha territorial do IBGE.</p>
  </header>

  <div class="painel">
    <div class="controles">
      <div class="ctrl">
        <span class="titulo">Turno</span>
        <div class="grupo" id="btnTurno">
          <button data-turno="t1">1º Turno</button>
          <button data-turno="t2" class="ativo">2º Turno</button>
        </div>
      </div>
      <div class="ctrl">
        <span class="titulo">Cor por</span>
        <div class="grupo" id="btnModo">
          <button data-modo="vencedor" class="ativo">Vencedor (margem)</button>
          <button data-modo="pct">% de um candidato</button>
        </div>
      </div>
      <div class="ctrl" id="ctrlCand" style="display:none">
        <span class="titulo">Candidato</span>
        <select id="selCand"></select>
      </div>
      <div class="resumo" id="resumo"></div>
    </div>
  </div>

  <div class="mapa-linha">
    <div class="mapa-box">
      <svg id="mapa" viewBox="0 0 900 840" role="img" aria-label="Mapa do Brasil"></svg>
    </div>
    <div class="legenda-box">
      <h3>Legenda</h3>
      <div id="legenda"></div>
      <div class="nota" id="nota"></div>
    </div>
  </div>

  <div class="painel">
    <table id="tabela">
      <thead>
        <tr>
          <th>UF</th><th>1º colocado</th><th>%</th><th>2º colocado</th><th>%</th>
          <th>Margem (p.p.)</th><th>Comparecimento</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <footer id="rodape"></footer>
</div>
<div id="tooltip"></div>

<script>const DADOS = /*__DADOS__*/;</script>
<script>const GEO = /*__GEO__*/;</script>
<script>
(function(){
  "use strict";

  // ---------- cores ----------
  var CORES = {
    "LULA":"#d62728",
    "FLAVIO BOLSONARO":"#1d4ed8",
    "ESCRITOR AUGUSTO CURY":"#f59e0b",
    "RENAN SANTOS":"#7c3aed",
    "RONALDO CAIADO":"#ea8a00",
    "ZEMA":"#0ea5e9",
    "SAMARA":"#db2777"
  };
  function corDe(cand){
    if(!CORES[cand]) return "#6b7280";
    return CORES[cand];
  }
  function hex2rgb(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
  function mix(a,b,t){
    var A=hex2rgb(a),B=hex2rgb(b);
    var r=Math.round(A[0]+(B[0]-A[0])*t), g=Math.round(A[1]+(B[1]-A[1])*t), bl=Math.round(A[2]+(B[2]-A[2])*t);
    return "rgb("+r+","+g+","+bl+")";
  }
  function clamp(x,a,b){ return x<a?a:(x>b?b:x); }
  function fmt(n){ return n.toLocaleString("pt-BR"); }
  function pct(n){ return n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }

  // ---------- estado da interface ----------
  var turno = "t2";       // t1 | t2
  var modo = "vencedor";  // vencedor | pct
  var candSel = null;     // nome curto do candidato no modo pct

  // ---------- projeção e paths ----------
  var proj = null;
  function calcularProjecao(){
    var xs=[], ys=[];
    function walk(c){
      if(typeof c[0]==="number"){
        var lon=c[0]*Math.PI/180, lat=c[1]*Math.PI/180;
        xs.push(lon); ys.push(Math.log(Math.tan(Math.PI/4+lat/2)));
      } else c.forEach(walk);
    }
    GEO.features.forEach(function(f){ walk(f.geometry.coordinates); });
    var x0=Math.min.apply(null,xs), x1=Math.max.apply(null,xs);
    var y0=Math.min.apply(null,ys), y1=Math.max.apply(null,ys);
    var W=900,H=840,pad=18;
    var k=Math.min((W-2*pad)/(x1-x0),(H-2*pad)/(y1-y0));
    var ox=(W-k*(x1-x0))/2, oy=(H-k*(y1-y0))/2;
    proj=function(lon,lat){
      var x=lon*Math.PI/180, y=Math.log(Math.tan(Math.PI/4+(lat*Math.PI/180)/2));
      return [ox+k*(x-x0), H-(oy+k*(y-y0))];
    };
  }
  function geomToPath(geom){
    function ring(pts){
      var d="", prev=null;
      for(var i=0;i<pts.length;i++){
        var p=proj(pts[i][0],pts[i][1]);
        var sx=Math.round(p[0]*10)/10, sy=Math.round(p[1]*10)/10;
        if(prev && prev[0]===sx && prev[1]===sy) continue;
        d += (i===0||!prev ? "M":"L")+sx+" "+sy+" ";
        prev=[sx,sy];
      }
      return d+"Z";
    }
    var t=geom.type, c=geom.coordinates, out="";
    if(t==="Polygon") out=c.map(ring).join(" ");
    else if(t==="MultiPolygon") out=c.map(function(p){ return p.map(ring).join(" "); }).join(" ");
    return out;
  }

  // ---------- dados por UF ----------
  function ufData(uf,t){ return DADOS.ufs[uf][t]; }
  function top2(d){ return d.cands.slice(0,2); }
  function margem(d){ var t=top2(d); return t.length<2?0:(t[0].p-t[1].p); }

  function corUF(uf){
    var d=ufData(uf,turno);
    if(modo==="vencedor"){
      var t=top2(d), base=corDe(t[0].nm);
      var m=margem(d);
      var intens=0.35+0.65*clamp(m/40,0,1);
      return mix("#ffffff",base,intens);
    }
    var alvo=d.cands.filter(function(c){ return c.nm===candSel; })[0];
    if(!alvo) return "#eceef1";
    var cor=corDe(alvo.nm);
    var tt=0.08+0.92*clamp(alvo.p/75,0,1);
    return mix("#f4f4f5",cor,tt);
  }

  // ---------- render ----------
  var svg=document.getElementById("mapa");
  var tooltip=document.getElementById("tooltip");
  var paths={};

  function montarMapa(){
    calcularProjecao();
    GEO.features.forEach(function(f){
      var uf=f.properties.sigla;
      var p=document.createElementNS("http://www.w3.org/2000/svg","path");
      p.setAttribute("d",geomToPath(f.geometry));
      p.setAttribute("class","uf");
      p.setAttribute("data-uf",uf);
      p.addEventListener("mousemove",function(ev){ mostrarTooltip(ev,uf); });
      p.addEventListener("mouseleave",function(){ tooltip.style.opacity=0; });
      svg.appendChild(p);
      paths[uf]=p;
    });
  }

  function mostrarTooltip(ev,uf){
    var d=ufData(uf,turno), t=top2(d);
    var html="<b>"+uf+" — "+DADOS.nomes[uf]+"</b>";
    t.forEach(function(c,i){
      html+="<div class='linha'><span>"+(i+1)+"º "+c.nm+" ("+c.sg+")</span><span>"+fmt(c.v)+" · "+pct(c.p)+"%</span></div>";
    });
    if(d.cands.length>2){
      html+="<div class='linha'><span>Demais candidatos</span><span>"+
        fmt(d.cands.slice(2).reduce(function(s,c){return s+c.v;},0))+"</span></div>";
    }
    html+="<div class='linha'><span>Comparecimento</span><span>"+pct(d.pcomp)+"% ("+fmt(d.tv)+" votos)</span></div>";
    html+="<div class='linha'><span>Eleitorado</span><span>"+fmt(d.te)+"</span></div>";
    tooltip.innerHTML=html;
    tooltip.style.opacity=1;
    var w=tooltip.offsetWidth, h=tooltip.offsetHeight;
    var x=ev.clientX+16, y=ev.clientY+16;
    if(x+w>window.innerWidth-8) x=ev.clientX-w-16;
    if(y+h>window.innerHeight-8) y=ev.clientY-h-16;
    tooltip.style.left=x+"px"; tooltip.style.top=y+"px";
  }

  function candidatosDoTurno(){
    // ordena por votos nacionais
    var tot={};
    Object.keys(DADOS.ufs).forEach(function(uf){
      ufData(uf,turno).cands.forEach(function(c){
        if(!tot[c.nm]) tot[c.nm]={nm:c.nm,sg:c.sg,v:0};
        tot[c.nm].v+=c.v;
      });
    });
    return Object.keys(tot).map(function(k){ return tot[k]; }).sort(function(a,b){ return b.v-a.v; });
  }

  function popularSelect(){
    var lista=candidatosDoTurno().slice(0,6);
    var sel=document.getElementById("selCand");
    sel.innerHTML="";
    lista.forEach(function(c){
      var o=document.createElement("option");
      o.value=c.nm; o.textContent=c.nm+" ("+c.sg+")";
      sel.appendChild(o);
    });
    if(!candSel || !lista.some(function(c){return c.nm===candSel;})) candSel=lista[0].nm;
    sel.value=candSel;
  }

  function renderLegenda(){
    var box=document.getElementById("legenda"), nota=document.getElementById("nota");
    if(modo==="vencedor"){
      var venc={};
      Object.keys(DADOS.ufs).forEach(function(uf){
        var w=ufData(uf,turno).cands[0].nm;
        venc[w]=(venc[w]||0)+1;
      });
      var html="<div class='chips'>";
      Object.keys(venc).sort(function(a,b){ return venc[b]-venc[a]; }).forEach(function(nm){
        html+="<div class='chip'><span class='sw' style='background:"+corDe(nm)+"'></span>"+
              "<span><b>"+nm+"</b> — "+venc[nm]+" UF"+(venc[nm]>1?"s":"")+"</span></div>";
      });
      html+="</div>";
      box.innerHTML=html;
      nota.innerHTML="Cada estado recebe a cor do candidato mais votado. A intensidade da cor cresce com a margem de vitória sobre o 2º colocado (faixa de 0 a 40 pontos percentuais).";
    } else {
      var cor=corDe(candSel);
      box.innerHTML=
        "<div style='font-weight:600'>"+candSel+"</div>"+
        "<div class='barra' style='background:linear-gradient(to right,#f4f4f5,"+cor+")'></div>"+
        "<div class='ticks'><span>0%</span><span>25%</span><span>50%</span><span>75%</span></div>";
      nota.innerHTML="Escala única de 0% a 75% dos votos válidos da UF, permitindo comparar estados entre si.";
    }
  }

  function renderResumo(){
    var venc={};
    Object.keys(DADOS.ufs).forEach(function(uf){
      var w=ufData(uf,turno).cands[0].nm;
      venc[w]=(venc[w]||0)+1;
    });
    var ranking=Object.keys(venc).map(function(k){ return k+" venceu em "+venc[k]+" UF"+(venc[k]>1?"s":""); });
    var nat=DADOS.nacional[turno];
    document.getElementById("resumo").innerHTML=
      "<b>Nacional: "+(turno==="t1"?"1º":"2º")+" turno</b><br>"+
      nat.cands.slice(0,2).map(function(c){ return c.nm+" "+pct(c.p)+"%"; }).join(" · ")+"<br>"+
      ranking.join(" · ");
  }

  function renderTabela(){
    var tb=document.querySelector("#tabela tbody");
    var ufs=Object.keys(DADOS.ufs).sort();
    tb.innerHTML=ufs.map(function(uf){
      var d=ufData(uf,turno), t=top2(d), m=margem(d);
      return "<tr>"+
        "<td><span class='ponto' style='background:"+corDe(t[0].nm)+"'></span><b>"+uf+"</b> · "+DADOS.nomes[uf]+"</td>"+
        "<td>"+t[0].nm+"</td><td class='num'>"+pct(t[0].p)+"</td>"+
        "<td>"+(t[1]?t[1].nm:"—")+"</td><td class='num'>"+(t[1]?pct(t[1].p):"—")+"</td>"+
        "<td class='num'>"+pct(m)+"</td>"+
        "<td class='num'>"+pct(d.pcomp)+"%</td>"+
      "</tr>";
    }).join("");
  }

  function render(){
    Object.keys(paths).forEach(function(uf){ paths[uf].setAttribute("fill",corUF(uf)); });
    renderLegenda(); renderResumo(); renderTabela();
    document.getElementById("ctrlCand").style.display = (modo==="pct")?"flex":"none";
  }

  // ---------- controles ----------
  document.getElementById("btnTurno").addEventListener("click",function(ev){
    var b=ev.target.closest("button"); if(!b) return;
    turno=b.dataset.turno;
    [].forEach.call(this.querySelectorAll("button"),function(x){ x.classList.toggle("ativo",x===b); });
    popularSelect(); render();
  });
  document.getElementById("btnModo").addEventListener("click",function(ev){
    var b=ev.target.closest("button"); if(!b) return;
    modo=b.dataset.modo;
    [].forEach.call(this.querySelectorAll("button"),function(x){ x.classList.toggle("ativo",x===b); });
    render();
  });
  document.getElementById("selCand").addEventListener("change",function(){
    candSel=this.value; render();
  });

  // ---------- rodapé ----------
  document.getElementById("rodape").innerHTML=
    "Fonte dos votos: Tribunal Superior Eleitoral — API de divulgação de resultados (<code>resultados.tse.jus.br/oficial/ele2026</code>), arquivos <code>-c0001-e006257-u.json</code> (1º turno) e <code>-c0001-e006258-u.json</code> (2º turno), 1 arquivo por UF, apuração de 100% das seções.<br>"+
    "Geometria: IBGE — Malha Territorial (<code>servicodados.ibge.gov.br/api/v3/malhas</code>), coordenadas simplificadas.<br>"+
    "Gerado em "+DADOS.meta.gerado+" · Percentuais sobre votos válidos, conforme publicado pelo TSE (vírgula decimal convertida para ponto).";

  // ---------- init ----------
  popularSelect();
  montarMapa();
  render();
})();
</script>
</body>
</html>
